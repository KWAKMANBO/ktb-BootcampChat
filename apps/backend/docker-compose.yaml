services:
  mongo:
    image: mongo:8
    container_name: mongo-ktb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bootcamp-chat
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2
    container_name: redis-ktb
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-ktb}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb-exporter:
    image: percona/mongodb_exporter:0.47.1
    container_name: mongodb-exporter-ktb
    restart: unless-stopped
    ports:
      - "9216:9216"
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
      - '--collect-all'
    depends_on:
      - mongo

  redis-exporter:
    image: oliver006/redis_exporter:v1.80.0
    container_name: redis-exporter-ktb
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus-ktb
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.${ENVIRONMENT:-dev}.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana-ktb
    restart: unless-stopped
    ports:
      - "9091:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources/prometheus.${ENVIRONMENT:-dev}.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  # Backend Instance 1
  backend-1:
    build: .
    container_name: backend-1-ktb
    restart: unless-stopped
    ports:
      - "5001:5001"  # HTTP
      - "5002:5002"  # WebSocket
    environment:
      PORT: 5001
      WS_PORT: 5002
      MONGO_URI: mongodb://mongo:27017/bootcamp-chat
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ktb}
      SESSION_STORE_TYPE: redis
      CHAT_STORE_TYPE: redis
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test}
      HOSTNAME: backend-1
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Backend Instance 2
  backend-2:
    build: .
    container_name: backend-2-ktb
    restart: unless-stopped
    ports:
      - "6001:6001"  # HTTP
      - "6002:6002"  # WebSocket
    environment:
      PORT: 6001
      WS_PORT: 6002
      MONGO_URI: mongodb://mongo:27017/bootcamp-chat
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ktb}
      SESSION_STORE_TYPE: redis
      CHAT_STORE_TYPE: redis
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test}
      HOSTNAME: backend-2
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Backend Instance 3
  backend-3:
    build: .
    container_name: backend-3-ktb
    restart: unless-stopped
    ports:
      - "7001:7001"  # HTTP
      - "7002:7002"  # WebSocket
    environment:
      PORT: 7001
      WS_PORT: 7002
      MONGO_URI: mongodb://mongo:27017/bootcamp-chat
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ktb}
      SESSION_STORE_TYPE: redis
      CHAT_STORE_TYPE: redis
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test}
      HOSTNAME: backend-3
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nginx-ktb
    restart: unless-stopped
    ports:
      - "8080:80"      # HTTP Load Balancer
      - "8081:8081"    # WebSocket Load Balancer
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
