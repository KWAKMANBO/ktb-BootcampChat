events {
    worker_connections 1024;
}

http {
    # HTTP API Load Balancer
    upstream backend_http {
        least_conn;
        server backend-1:5001;
        server backend-2:6001;
        server backend-3:7001;
    }

    # WebSocket Load Balancer
    upstream backend_ws {
        ip_hash;  # Sticky sessions for WebSocket
        server backend-1:5002;
        server backend-2:6002;
        server backend-3:7002;
    }

    # HTTP API Proxy
    server {
        listen 80;

        location / {
            proxy_pass http://backend_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /actuator/health {
            proxy_pass http://backend_http/actuator/health;
            access_log off;
        }
    }

    # WebSocket Proxy
    server {
        listen 8081;

        location / {
            proxy_pass http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
